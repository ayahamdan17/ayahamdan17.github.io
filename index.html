<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aya hamdan</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://use.typekit.net/vnq6jfd.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Cormorant:ital,wght@0,300..700;1,300..700&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Sen:wght@400..800&family=Tiny5&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stylesheet.css">

  <style>
    /* ── Single-image viewer (index page only) ── */
    .viewer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 180px;                 /* clears the desktop sidebar */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 60px 28px;
      background: #ffffff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      border: 0;
      font: inherit;
      color: inherit;
      width: auto;
    }
    .viewer:focus-visible { outline: 1px solid #aed3c5; outline-offset: -8px; }

    /* Every image is shown in the same fixed frame.
       Change --ratio to reshape it (width ÷ height: 1.5 = landscape 3:2, 1 = square, 0.8 = portrait 4:5). */
    .viewer { --ratio: 0.66; }

    .viewer-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      container-type: size;        /* lets the frame size itself from the space available */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-frame {
      aspect-ratio: var(--ratio);
      width: min(100cqw, calc(100cqh * var(--ratio)));
      overflow: hidden;
    }
    .viewer-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;           /* fills the frame; crops edges if the photo's shape differs */
    }

    .viewer-meta {
      padding-top: 14px;
      font-size: 13px;
      line-height: 1.2;
      color: black;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    @media (max-width: 768px) {
      .viewer {
        left: 0;
        top: 70px;                 /* height of the mobile header bar */
        padding: 8px 20px 24px;
      }
    }
  </style>
</head>

<body>

  <!-- Sidebar loads directly via script (keep this before the viewer) -->
  <script src="sidebar.js"></script>

  <!-- ── Tap-to-change image viewer ── -->
  <button class="viewer" id="viewer" type="button" aria-label="Next image">
    <div class="viewer-stage">
      <div class="viewer-frame">
        <img id="viewerImg" src="" alt="">
      </div>
    </div>
    <div class="viewer-meta" id="viewerCount"></div>
  </button>

  <script>
    /* Add or remove filenames here. They are shuffled on every page load,
       except the first one, which always opens the page. */
    const folder = './Film/';
    const firstImage = '20.140-min.jpg';
    const otherImages = [
      '12.16-2.jpg',
      '12.18-min.jpg',
      '17.26-2.jpg',
      '18.41-min.jpg',
      '18.47-min.jpg',
      '18.48-min.jpg',
      '18.52-min.jpg',
      '18.62-min.jpg',
      '18.78-min.jpg',
      '18.95-min.jpg',
      '18.97-min.jpg',
      '18.107-min.jpg',
      '18.108-min.jpg',
      '18.128-min.jpg',
      '18.130-min.jpg',
      '18.133-min.jpg',
      '18.137-min.jpg',
      '19.003-min.jpg',
      '19.020-min.jpg',
      '19.076-min.jpg',
      '20.17-min.jpg',
      '20.18-min.jpg',
      '20.32-min.jpg',
      '20.45-min.jpg',
      '20.56-min.jpg',
      '20.59-min.jpg',
      '20.57-min.jpg',
      '20.62-min.jpg',
      '20.71-min.jpg',
      '20.74-min.jpg',
      '20.100-min.jpg',
      '20.180-min.jpg',
      '20.201-min-2.jpg',
      '20.222-min.jpg',
      '20.233-min.jpg',
      'Lebanon-6.jpg',
      'Lebanon-11.jpg',
      'raouche2.jpg',
      'sporting.jpg'
    ];

    /* Fisher-Yates shuffle */
    for (let i = otherImages.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [otherImages[i], otherImages[j]] = [otherImages[j], otherImages[i]];
    }

    /* encodeURIComponent turns the spaces in "20.166-min 2.jpg" into %20 */
    const images = [firstImage].concat(otherImages).map(function (name) {
      return { src: folder + encodeURIComponent(name), alt: 'Photograph by Aya Hamdan' };
    });

    const viewer  = document.getElementById('viewer');
    const imgEl   = document.getElementById('viewerImg');
    const countEl = document.getElementById('viewerCount');

    let index = 0;

    function preload(i) {
      const n = (i + images.length) % images.length;
      new Image().src = images[n].src;
    }

    function show(i) {
      index = (i + images.length) % images.length;
      const item = images[index];
      imgEl.src = item.src;
      imgEl.alt = item.alt;
      countEl.textContent = (index + 1) + ' / ' + images.length;
      preload(index + 1);
      preload(index - 1);
    }

    /* Tap or click: right 2/3 goes forward, left 1/3 goes back (desktop only).
       On touch screens any tap goes forward. */
    viewer.addEventListener('click', function (e) {
      const isTouch = window.matchMedia('(pointer: coarse)').matches;
      const x = e.clientX - viewer.getBoundingClientRect().left;
      if (!isTouch && x < viewer.clientWidth / 3) {
        show(index - 1);
      } else {
        show(index + 1);
      }
    });

    /* Keyboard arrows */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') show(index + 1);
      if (e.key === 'ArrowLeft')  show(index - 1);
    });

    /* Swipe left/right on touch screens */
    let touchX = null;
    viewer.addEventListener('touchstart', function (e) {
      touchX = e.changedTouches[0].clientX;
    }, { passive: true });
    viewer.addEventListener('touchend', function (e) {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 50) {
        show(dx < 0 ? index + 1 : index - 1);
        e.preventDefault();        /* stops the swipe from also firing a click */
      }
    });

    show(0);
  </script>

</body>

</html>
